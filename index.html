<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Train of Seven Doors</title>
<style>
:root{
  --velvet0:#241636; --velvet1:#2e1c46; --velvet2:#3a2456; --panel:#33204d; --panel2:#3d2859;
  --line:#4d3570; --gold:#d9a441; --gold2:#f0c96b; --parch:#f2e8d5; --muted:#b7a6cc;
  --rose:#e5798b; --teal:#8fd0c6; --danger:#e5484d; --accent:#d9a441;
  --shadow:0 10px 30px rgba(10,4,20,.55);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1200px 700px at 50% -10%, #35214f 0%, var(--velvet0) 55%, #1a0f29 100%);
  color:var(--parch); font-family:Georgia,"Iowan Old Style","Times New Roman",serif;
  min-height:100vh; display:flex; flex-direction:column; align-items:center;
}
#app{width:100%; max-width:920px; padding:10px 12px 18px; display:flex; flex-direction:column; gap:10px; flex:1}
button{font-family:inherit}
.hidden{display:none!important}

/* ---------- header ---------- */
#hdr{display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap}
#hdr .brand{font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
#hdr .brand b{color:var(--gold); font-weight:normal}
.hbtns{display:flex; gap:6px; flex-wrap:wrap}
.hbtn{background:transparent; border:1px solid var(--line); color:var(--muted); border-radius:8px;
  padding:5px 10px; font-size:12px; cursor:pointer; letter-spacing:.06em}
.hbtn[aria-pressed="true"], .hbtn.on{color:var(--gold2); border-color:var(--gold); background:rgba(217,164,65,.10)}
.hbtn:hover{color:var(--gold2)}

/* ---------- generic panels ---------- */
.panel{background:linear-gradient(180deg,var(--panel) 0%,var(--velvet1) 100%);
  border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow)}
.scene{position:relative; overflow:hidden; border-radius:14px 14px 0 0; border-bottom:1px solid var(--line)}
.scene svg{display:block; width:100%; height:auto}
.card{padding:14px 16px 16px}
.prose{font-size:clamp(15px,2.4vw,17.5px); line-height:1.55; color:var(--parch)}
.prose q, .prose em{color:var(--gold2); font-style:italic}
.wagonTag{display:inline-block; font-size:12px; letter-spacing:.18em; text-transform:uppercase;
  color:var(--accent); border:1px solid var(--accent); padding:3px 10px; border-radius:999px; margin-bottom:10px}

/* ---------- buttons ---------- */
.btnrow{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px}
.btn{cursor:pointer; border-radius:10px; border:1px solid var(--gold); color:#1d1229;
  background:linear-gradient(180deg,var(--gold2),var(--gold)); padding:10px 18px; font-size:15px;
  letter-spacing:.03em; box-shadow:0 4px 14px rgba(217,164,65,.25)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent; color:var(--gold2); box-shadow:none; border-color:var(--line)}
.btn.ghost:hover{border-color:var(--gold)}
.btn.big{font-size:17px; padding:13px 26px; min-width:210px}
.btn:disabled{opacity:.45; cursor:default; box-shadow:none}
.kchip{display:inline-block; margin-left:8px; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase;
  padding:2px 8px; border-radius:999px; border:1px solid currentColor}
.choice{display:block; width:100%; text-align:left; background:rgba(61,40,89,.5); border:1px solid var(--line);
  color:var(--parch); border-radius:12px; padding:12px 14px; margin-top:10px; cursor:pointer}
.choice:hover{border-color:var(--gold); background:rgba(217,164,65,.08)}
.choice .cl{font-size:16px; color:var(--gold2)}
.choice .ch{font-size:13px; color:var(--muted); margin-top:3px; line-height:1.4}
.choice .kchip{float:right; margin-left:10px}

/* ---------- gains ---------- */
.gains{list-style:none; margin:10px 0 0; padding:0}
.gains li{padding:6px 10px; margin:6px 0; background:rgba(217,164,65,.08); border:1px solid rgba(217,164,65,.35);
  border-radius:8px; color:var(--gold2); font-size:15px}
.gains li.cost{background:rgba(229,72,77,.08); border-color:rgba(229,72,77,.4); color:#f0a3a6}

/* ---------- door ---------- */
.doorwrap{display:flex; flex-direction:column; align-items:center; padding:26px 14px 30px; text-align:center}
.doorNum{font-size:clamp(30px,7vw,46px); letter-spacing:.3em; color:var(--gold2); text-transform:uppercase}
.doorSub{color:var(--muted); margin:8px 0 4px; font-size:15px}
.doorOrn{margin:10px 0 4px; width:min(320px,80%)}

/* ---------- combat ---------- */
#combat{display:flex; flex-direction:column; gap:10px}
.enemyrow{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; padding:12px 8px 6px}
.foe{position:relative; width:150px; background:linear-gradient(180deg,rgba(61,40,89,.65),rgba(36,22,54,.65));
  border:1px solid var(--line); border-radius:12px; padding:8px 8px 10px; text-align:center; cursor:pointer}
.foe.target{border-color:var(--gold); box-shadow:0 0 0 1px var(--gold), 0 0 18px rgba(217,164,65,.25)}
.foe.dead{opacity:.28; filter:grayscale(.8); pointer-events:none}
.foe .fname{font-size:12.5px; color:var(--parch); line-height:1.2; min-height:30px; display:flex; align-items:center; justify-content:center}
.foe svg{width:86px; height:86px; display:block; margin:2px auto}
.hpbar{height:9px; background:#1c1128; border-radius:6px; overflow:hidden; border:1px solid #1a1024; margin-top:4px}
.hpbar i{display:block; height:100%; background:linear-gradient(90deg,#e5484d,#e5798b); transition:width .35s ease}
.intent{margin-top:7px; font-size:12px; color:var(--gold2); border:1px dashed rgba(217,164,65,.5);
  border-radius:8px; padding:4px 6px; line-height:1.35}
.intent.chg{color:#f2b8c6; border-color:rgba(229,72,77,.6)}
.intent.blk{color:var(--teal); border-color:rgba(143,208,198,.5)}
.intent .iv{font-weight:bold}
.eblock{position:absolute; top:6px; right:6px; font-size:11px; color:var(--teal); border:1px solid var(--teal);
  border-radius:6px; padding:1px 5px; background:rgba(20,12,30,.7)}

.you{display:flex; gap:12px; align-items:center; padding:10px 14px; flex-wrap:wrap}
.you .port{width:74px; height:74px; flex:0 0 auto}
.bars{flex:1; min-width:200px; display:flex; flex-direction:column; gap:6px}
.statline{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted)}
.statline .lbl{width:52px; letter-spacing:.08em; text-transform:uppercase; font-size:10.5px}
.bar{flex:1; height:12px; background:#1c1128; border-radius:7px; overflow:hidden; border:1px solid #1a1024}
.bar i{display:block; height:100%; transition:width .35s ease}
.bar.hp i{background:linear-gradient(90deg,#c2455a,#e5798b)}
.bar.en i{background:linear-gradient(90deg,#4f9d92,#8fd0c6)}
.statline .val{width:64px; text-align:right; color:var(--parch); font-size:12.5px}
.shieldchip{color:var(--teal); border:1px solid var(--teal); border-radius:8px; padding:1px 7px; font-size:12px}
.pips{display:flex; gap:3px; align-items:center}
.pip{width:9px; height:9px; border-radius:50%; border:1px solid var(--teal); opacity:.35}
.pip.on{background:var(--teal); opacity:1}
.pip.next{box-shadow:0 0 0 2px rgba(217,164,65,.35)}
.starpips{display:inline-flex; gap:3px; margin-left:6px}
.starpips i{width:7px; height:7px; border-radius:50%; border:1px solid var(--gold); opacity:.3; font-style:normal}
.starpips i.on{background:var(--gold); opacity:1}

#invbar{display:flex; gap:6px; flex-wrap:wrap; padding:8px 14px; align-items:center}
#invbar .ilbl{font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-right:2px}
.item{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:rgba(36,22,54,.6);
  color:var(--parch); border-radius:9px; padding:4px 8px; font-size:12.5px}
.item.use{cursor:pointer}
.item.use:hover{border-color:var(--gold)}
.item .n{color:var(--gold2)}
.item.pas{border-style:dashed; color:var(--muted)}

#actions{display:flex; gap:8px; flex-wrap:wrap; padding:4px 14px 14px}
.abtn{flex:1; min-width:120px; cursor:pointer; border-radius:10px; padding:10px 8px; font-size:14.5px;
  border:1px solid var(--gold); color:#1d1229; background:linear-gradient(180deg,var(--gold2),var(--gold))}
.abtn small{display:block; font-size:10.5px; letter-spacing:.04em; opacity:.75; margin-top:2px}
.abtn.alt{background:transparent; color:var(--gold2)}
.abtn:disabled{opacity:.4; cursor:default}
.abtn:active{transform:translateY(1px)}

#log{margin:0 14px 12px; padding:8px 10px; background:rgba(20,12,30,.55); border:1px solid var(--line);
  border-radius:10px; font-size:13px; color:var(--muted); line-height:1.5; min-height:44px}
#log b{color:var(--parch); font-weight:normal}
#log .lg-star, #log .lg-good{color:var(--gold2)}
#log .lg-bad{color:#f0a3a6}

/* ---------- ending / gameover ---------- */
.endwrap{text-align:center; padding:24px 16px 28px}
.endtitle{font-size:clamp(24px,5.4vw,34px); color:var(--gold2); letter-spacing:.06em; margin:6px 0 14px}
.endcols{max-width:640px; margin:0 auto; text-align:left}
.stats{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin:16px 0 6px}
.stat{border:1px solid var(--line); border-radius:10px; padding:6px 12px; font-size:12.5px; color:var(--muted)}
.stat b{color:var(--parch); font-weight:normal}

/* ---------- title ---------- */
#title{display:flex; flex-direction:column; align-items:center; text-align:center; padding:16px 14px 24px}
.gtitle{font-size:clamp(26px,6.4vw,44px); color:var(--gold2); letter-spacing:.04em; margin:10px 0 2px; line-height:1.12}
.gsub{color:var(--muted); font-style:italic; margin-bottom:14px; font-size:clamp(14px,2.6vw,16px)}
.endstars{display:flex; gap:10px; margin:10px 0 2px; font-size:12.5px; color:var(--muted)}
.endstars span{border:1px solid var(--line); border-radius:999px; padding:3px 10px}
.endstars span.got{color:var(--gold2); border-color:var(--gold)}
.credit{margin-top:18px; font-size:11.5px; color:var(--muted); letter-spacing:.04em}
.credit a{color:var(--muted)}

/* ---------- howto ---------- */
#howto{position:fixed; inset:0; background:rgba(14,7,24,.82); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px}
#howto .panel{max-width:560px; max-height:86vh; overflow:auto; border-radius:14px}
#howto ol{margin:8px 0 0; padding-left:20px; line-height:1.55; font-size:14.5px}
#howto li{margin:7px 0}

/* ---------- fx ---------- */
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.shake{animation:shake .38s ease}
@keyframes hitflash{0%{filter:brightness(2.4) saturate(.4)}100%{filter:none}}
.hitflash{animation:hitflash .4s ease}
@keyframes floatup{0%{opacity:0; transform:translateY(6px)}25%{opacity:1}100%{opacity:0; transform:translateY(-26px)}}
.dmgfloat{position:absolute; left:50%; top:8px; transform:translateX(-50%); font-size:19px; color:#f0c96b;
  text-shadow:0 2px 6px rgba(0,0,0,.6); animation:floatup 1s ease forwards; pointer-events:none; z-index:5}
.dmgfloat.bad{color:#f2a0ab}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(217,164,65,.0)}50%{box-shadow:0 0 16px 2px rgba(217,164,65,.35)}}
.pulse{animation:pulse 2.2s ease infinite}
@keyframes flicker{0%,100%{opacity:.85}45%{opacity:1}55%{opacity:.75}70%{opacity:.95}}
.flicker{animation:flicker 3.4s ease infinite}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-46px)}}
.starsA{animation:drift 26s linear infinite}
.starsB{animation:drift 15s linear infinite}
@media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }

@media (max-width:560px){
  .foe{width:132px}
  .foe svg{width:70px;height:70px}
  .abtn{min-width:104px; font-size:13.5px}
  .card{padding:12px 12px 14px}
}
</style>
</head>
<body>
<div id="app">
  <div id="hdr">
    <div class="brand" id="brand"></div>
    <div class="hbtns" id="hbtns"></div>
  </div>
  <div id="stage"></div>
  <div id="howto" class="hidden"></div>
</div>

  "s1.p1":"You wake to the click of rails. A velvet seat, a window full of stars, and no ticket in your pocket — only a folded note.",

  "s6.p1":"Door VI. The ghost car. Passengers the colour of moonlight nod at you, politely, from seats they no longer dent. At the far end, under a silver cap, waits the Inspector of the Sixth Door.",
  "s6.win":"The inspector folds into a single ticket, punched clean through. In the crew nook, a kettle still sings; you drink something that tastes of being remembered.",
  "s7.p1":"Door VII. The coal tender. Night wind, coal dust like slow snow. The locomotive is one door away, breathing.",
  "s7.q":"A few minutes to yourself before the last door. Spend them how?",
  "s7.sleep.l":"Sleep by the hatch","s7.sleep.h":"The boiler is warm. The dream is good precisely because it is empty.",
  "s7.sharpen.l":"Sharpen your iron","s7.sharpen.h":"Whet the travelling iron until it hums. The final fight starts with the foe 6 HP shorter.",
  "s7.sleep.p":"You sleep against the warm hatch and dream of nothing — the good nothing.",
  "s7.sharpen.p":"You whet your iron until it hums a small tune of its own.",
  "f.p1":"The cab is all copper and fireglow. A figure feeds the boiler with shovels of night. Its goggles reflect a furnace it never looks at.",
  "f.p2":"<q>Every traveller reaches this door,</q> says the Midnight Engineer. <q>Fewer reach the fire still choosing. Show me which kind you are.</q>",
  "f.phase2":"The Engineer sets down the shovel. The fire leans out of the boiler to watch. Now comes the drive itself.",
  "f.q":"The furnace stands open. The train's fire — warm, patient, made of every lantern ever left behind on every journey — waits for your hand.",
  "f.fire.l":"Take the fire","f.fire.h":"Become the Engineer. The train runs on, and on.",
  "f.dawn.l":"Let it go","f.dawn.h":"Open the damper wide. Let the fire see the sky.",
  "end.fire.t":"The Fire Is Yours",
  "end.fire.p1":"You take the fire. It weighs nothing and everything, like a decision finally made.",
  "end.fire.p2":"The engine sings. The seven doors close behind you — each one, now, opening onto wherever you ask.",
  "end.fire.child":"In the last carriage, the lantern child waves. You dim the headlamp once, gently, so as not to wake the moths.",
  "end.dawn.t":"Daybreak",
  "end.dawn.p1":"You pull the damper wide. The fire rises through the funnel like a flock of sparks that finally remembers it can fly.",
  "end.dawn.p2":"The train slows into a pink horizon. You step down onto a platform that smells of rain. The note in your pocket is blank now. That is fine.",
  "end.dawn.child":"A moth with star wings settles on your shoulder just as the sun comes up.",
  "go.t":"The Train Carries You Back",
  "go.p":"Warm darkness, the click of rails. A voice like punched cardboard: <q>Not this door, traveller. Rest. Try the wagon again.</q>",
  "up.q":"The door between carriages offers a gift. Choose one.",

/* ---------------- state ---------------- */
var S = null;
var DEFAULT_LANG = "en";
function freshState(lang, seed){
  return {
    lang: lang||"en", seed: (seed>>>0), a: (seed>>>0),
    hp:30, maxHp:30, en:6, maxEn:10,
    inv:{tart:0, tea:0}, passives:{}, ups:{},
    stage:0, queue:[], pageIdx:0, combat:null, flags:{},
    stats:{combats:0, won:0, turns:0, dmg:0, doors:0, items:0},
    snap:null, log:[], view:{type:"title"}, over:false, ending:null, tipCharge:false
  };
}
function R(){ S.a|=0; S.a = S.a + 0x6D2B79F5 | 0; var t = Math.imul(S.a ^ S.a>>>15, 1|S.a); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14)>>>0)/4294967296; }
function rint(lo,hi){ return lo + Math.floor(R()*(hi-lo+1)); }
function hasUp(id){ return !!S.ups[id]; }
function hasP(id){ return !!S.passives[id]; }
function pushLog(k,p,cls){ S.log.push({k:k,p:p||{},cls:cls||""}); if(S.log.length>40) S.log.shift(); }

function snapshot(){ return {
  hp:S.hp, maxHp:S.maxHp, en:S.en, maxEn:S.maxEn,
  inv:JSON.parse(JSON.stringify(S.inv)), passives:JSON.parse(JSON.stringify(S.passives)),
  ups:JSON.parse(JSON.stringify(S.ups)), flags:JSON.parse(JSON.stringify(S.flags)),
  stats:JSON.parse(JSON.stringify(S.stats))
}; }
function restore(snap){ S.hp=Math.max(1,Math.ceil(snap.maxHp*0.7)); S.maxHp=snap.maxHp; S.en=snap.en; S.maxEn=snap.maxEn;
  S.inv=JSON.parse(JSON.stringify(snap.inv)); S.passives=JSON.parse(JSON.stringify(snap.passives));
  S.ups=JSON.parse(JSON.stringify(snap.ups)); S.flags=JSON.parse(JSON.stringify(snap.flags)); }

/* ---------------- effects ---------------- */
function applyEffects(list){
  var gains=[];
  list.forEach(function(e){
    if(e.t==="heal"){ var v=Math.min(e.v, S.maxHp-S.hp); S.hp+=v; gains.push(["gain.hp",{v:v}]); }
    else if(e.t==="hp"){ S.hp+=e.v; if(S.hp<1)S.hp=1; gains.push(["gain.hpn",{v:-e.v},"cost"]); }
    else if(e.t==="maxhp"){ S.maxHp+=e.v; S.hp+=e.v; gains.push(["gain.maxhp",{v:e.v}]); }
    else if(e.t==="maxen"){ S.maxEn+=e.v; gains.push(["gain.maxen",{v:e.v}]); }
    else if(e.t==="item"){ S.inv[e.id]=(S.inv[e.id]||0)+(e.n||1); gains.push(["gain.item",{x:T("it."+e.id+".n")}]); }
    else if(e.t==="passive"){ S.passives[e.id]=true; gains.push(["gain.item",{x:T("it."+e.id+".n")}]); }
    else if(e.t==="flag"){ S.flags[e.k]=e.v; }
    else if(e.t==="dyn"){ var g=DYN[e.id](); gains.push(g); }
    else if(e.t==="dynFirst"){ S.flags.firstStrike=true; gains.push(["gain.first",{}]); }
  });
  return gains;
}

/* ---------------- interpreter ---------------- */
function enterStage(i){
  S.stage=i; S.queue=STAGES[i].steps.slice(); S.pageIdx=0; S.snap=snapshot();
  advance();
}
function advance(){
  if(!S.queue.length){
    if(S.stage+1 < STAGES.length){ enterStage(S.stage+1); }
    else { S.view={type:"title"}; }
    return;
  }
  var step=S.queue.shift();
  switch(step.t){
    case "story":
      S.pageIdx=0; S.view={type:"story", stage:S.stage, pages:step.pages.slice()}; break;
    case "branch":
      S.view={type:"branch", stage:S.stage, q:step.q, options:step.options.map(function(o){return {id:o.id,kind:o.kind||"",l:o.l,h:o.h};})}; break;
    case "choice":
      S.view={type:"choice", stage:S.stage, q:step.q, options:step.options.map(function(o){return {id:o.id,kind:o.kind||"",l:o.l,h:o.h};})}; break;
    case "reward":
      S.view={type:"reward", stage:S.stage, q:step.q, options:step.options.map(function(o){return {id:o.id, item:o.item};})}; break;
    case "upgrade":
      var pair=UPGRADE_PAIRS[step.pair];
      S.view={type:"upgrade", stage:S.stage, options:pair.map(function(id){return {id:id};})}; break;
    case "effects":
      var gains=applyEffects(step.list);
      S.view={type:"gains", stage:S.stage, lead:step.lead||null, gains:gains}; break;
    case "catTrade":
      var opts=[];
      if((S.inv.tart||0)>0) opts.push({id:"tradetart", l:"s5.cat.tart", h:"s5.cat.tart.h", cost:"tart"});
      else if((S.inv.tea||0)>0) opts.push({id:"tradetea", l:"s5.cat.tea", h:"s5.cat.tea.h", cost:"tea"});
      else opts.push({id:"tradehp", l:"s5.cat.hp", h:"s5.cat.hp.h", cost:"hp"});
      opts.push({id:"refuse", l:"s5.cat.refuse", h:"s5.cat.refuse.h"});
      S.view={type:"choice", stage:S.stage, q:null, cat:true, options:opts}; break;
    case "combat":
      startCombat(step.enemies, step.then||[], step.finale||0); break;
    case "door":
      S.view={type:"door", stage:S.stage, n:step.n}; break;
    case "finalChoice":
      S.view={type:"choice", stage:S.stage, final:true, q:"f.q", options:[
        {id:"fire", l:"f.fire.l", h:"f.fire.h"},
        {id:"dawn", l:"f.dawn.l", h:"f.dawn.h"}]}; break;
    case "ending":
      buildEnding(); break;
    default: advance();
  }
}

/* ---------------- combat ---------------- */
function spawnEnemy(key){
  var def=ENEMIES[key];
  return {k:key, hp:def.hp, maxHp:def.hp, si:0, block:0, intent:def.script[0]};
}
function startCombat(keys, then, finale){
  var list=keys.map(spawnEnemy);
  if(finale===1){
    if(hasP("key")) list[0].hp-=8;
    if(S.flags.firstStrike) list[0].hp-=6;
    if(list[0].hp<1) list[0].hp=1;
  }
  S.combat={ list:list, you:{block:0}, strikes:0, turn:1, finale:finale||0, then:then||[], phase:finale||0 };
  S.en = Math.min(S.maxEn, 6 + (hasUp("whistle")?4:0));
  S.stats.combats++;
  S.view=combatView();
}
function aliveList(){ return S.combat.list.filter(function(e){return e.hp>0;}); }
function combatView(){
  var c=S.combat;
  var abilityCost=hasUp("flame")?3:4;
  return { type:"combat", stage:S.stage,
    enemies:c.list.map(function(e,i){ return {i:i, k:e.k, hp:e.hp, maxHp:e.maxHp, block:e.block, intent:e.intent}; }),
    you:{hp:S.hp, maxHp:S.maxHp, en:S.en, maxEn:S.maxEn, block:c.you.block, strikes:c.strikes},
    actions:{strike:true, guard:true, ability:S.en>=abilityCost, cost:abilityCost},
    items:{tart:(S.inv.tart||0)>0, tea:(S.inv.tea||0)>0},
    log:S.log.slice(-8),
    tip:(!S.tipCharge && c.list.some(function(e){return e.hp>0 && e.intent.t==="charge";})) ? "tip.charge" : null };
}
function hitEnemy(e, dmg, ignoreBlock){
  var d=dmg;
  if(e.block>0 && !ignoreBlock){
    var b=Math.min(e.block, dmg-1); d=dmg-b;
    pushLog("log.eblock",{e:T("en."+e.k),v:b});
    e.block=0;
  }
  e.hp-=d; S.stats.dmg+=d;
  if(e.hp<0){ d+=e.hp; S.stats.dmg+=e.hp; e.hp=0; } // count real damage only
  return d;
}
function enemyHitsYou(e, base){
  var v=base;
  if(ENEMIES[e.k].family==="conductor" && hasP("ticket")) v=Math.max(1, v-4);
  var blocked=0;
  if(S.combat.you.block>0){ blocked=Math.min(S.combat.you.block, v); S.combat.you.block-=blocked; v-=blocked; }
  S.hp-=v;
  return {took:v, blocked:blocked};
}
function afterPlayerAction(){
  var c=S.combat;
  var alive=aliveList();
  if(!alive.length){
    S.stats.won++;
    pushLog("log.win");
    S.combat=null;
    S.view={type:"gains", stage:S.stage, lead:null, gains:[], win:true};
    return; // advance happens on choose('ok') → queue then-steps
  }
  // enemy phase
  var youHit=false;
  alive.forEach(function(e){
    var it=e.intent, def=ENEMIES[e.k];
    if(it.t==="hit"){
      var r=enemyHitsYou(e, it.v);
      if(r.blocked>0) pushLog("log.eblocked",{v:r.blocked},"lg-good");
      if(r.took>0){ pushLog("log.ehit",{e:T("en."+e.k),v:r.took},"lg-bad"); youHit=true; }
    } else if(it.t==="drain"){
      var r2=enemyHitsYou(e, it.v);
      if(r2.blocked>0) pushLog("log.eblocked",{v:r2.blocked},"lg-good");
      if(r2.took>0){ pushLog("log.ehit",{e:T("en."+e.k),v:r2.took},"lg-bad"); youHit=true; }
      S.en=Math.max(0,S.en-it.d);
      pushLog("log.drain",{e:T("en."+e.k),v:it.d},"lg-bad");
    } else if(it.t==="charge"){
      S.tipCharge=true;
      pushLog("log.charge",{e:T("en."+e.k)});
    } else if(it.t==="block"){
      e.block=it.v;
      pushLog("log.cap",{e:T("en."+e.k)});
    }
    if(e.hp>0){ e.si=(e.si+1)%def.script.length; e.intent=def.script[e.si]; }
  });
  if(S.hp<=0){
    S.hp=0; S.combat=null; S.over=true;
    S.view={type:"gameover", stage:S.stage};
    return;
  }
  // new player turn
  c.you.block=0;
  S.en=Math.min(S.maxEn, S.en+2+(hasP("lantern")?1:0));
  c.turn++; S.stats.turns++;
  S.lastYouHit=youHit;
  S.view=combatView();
}

/* ---------------- API ---------------- */
var API = {
  version: VERSION, langs: LANGS, i18n: I18N, enemies: ENEMIES, stages: STAGES, upgradePairs: UPGRADE_PAIRS,
  T:function(k,p){ return T(k,p); },
  setLang:function(l){ if(I18N[l]){ DEFAULT_LANG=l; if(S){ S.lang=l; } } return S ? S.lang : DEFAULT_LANG; },
  state:function(){ return S ? JSON.parse(JSON.stringify(S)) : null; },
  view:function(){ return S ? JSON.parse(JSON.stringify(S.view)) : null; },
  newRun:function(seed){
    seed = (seed===undefined) ? (Math.floor(Math.random()*0x7fffffff)>>>0) : (seed>>>0);
    S = freshState(DEFAULT_LANG, seed);
    enterStage(0);
    return API.view();
  },
  choose:function(id){
    if(!S) return null;
    var v=S.view;
    if(v.type==="story" && id==="next"){
      S.pageIdx++;
      if(S.pageIdx>=v.pages.length) advance();
      return API.view();
    }
    if(v.type==="gains" && id==="ok"){
      if(v.win && S.combat===null){
        S.queue=S.combatThen.concat(S.queue);
      }
      advance();
      return API.view();
    }
    if(v.type==="branch" || v.type==="choice" || v.type==="reward" || v.type==="upgrade"){
      var opt=null, pool=null;
      if(v.type==="branch"){ pool=STAGES[S.stage].steps; }
      if(v.type==="branch"||v.type==="choice"){
        opt=v.options.filter(function(o){return o.id===id;})[0];
      } else if(v.type==="reward"){
        opt=v.options.filter(function(o){return o.id===id;})[0];
        if(opt){ applyEffects([{t:"item",id:opt.item,n:1}]); advance(); return API.view(); }
      } else if(v.type==="upgrade"){
        opt=v.options.filter(function(o){return o.id===id;})[0];
        if(opt){ S.ups[id]=true;
          var fx=[];
          if(id==="breath"){ S.maxEn+=4; fx=[["gain.maxen",{v:4}]]; }
          if(id==="coat"){ S.maxHp+=8; S.hp+=8; fx=[["gain.maxhp",{v:8}],["gain.hp",{v:8}]]; }
          S.view={type:"gains", stage:S.stage, lead:null, gains:fx};
          return API.view();
        }
      }
      if(opt && v.type!=="upgrade"){
        // find original option with steps
        var full=findOption(v, id);
        if(full && full.steps){ S.queue=full.steps.concat(S.queue); }
        if(full && full.effects){ applyEffects(full.effects); }
        if(v.cat && id!=="refuse"){
          var costs={tradetart:["tart"],tradetea:["tea"],tradehp:["hp"]};
          var c=costs[id];
          if(c){ 
            if(id==="tradetart"){ S.inv.tart--; }
            if(id==="tradetea"){ S.inv.tea--; }
            if(id==="tradehp"){ S.maxHp-=5; if(S.hp>S.maxHp)S.hp=S.maxHp; }
            S.passives.key=true;
            var hint=id==="tradehp"?"s5.cat.hp.h":(id==="tradetart"?"s5.cat.tart.h":"s5.cat.tea.h");
            S.view={type:"gains", stage:S.stage, lead:hint, gains:[["gain.item",{x:T("it.key.n")}]]};
            return API.view();
          }
        }
        advance();
      }
      return API.view();
    }
    if(v.type==="door" && id==="open"){
      S.stats.doors++;
      advance();
      return API.view();
    }
    if(v.type==="finalChoiceSel" ){ /* unused */ }
    if(v.type==="choice" ){ }
    return API.view();
  },
  /* target: index into combat list */
  act:function(action, target, item){
    if(!S || !S.combat) return API.view();
    var c=S.combat;
    var alive=aliveList();
    if(!alive.length) return API.view();
    var t=c.list[target];
    if(!t || t.hp<=0){ t=alive[0]; target=c.list.indexOf(t); }
    if(action==="strike"){
      var dmg=rint(5,7)+(hasUp("blade")?2:0);
      c.strikes++;
      var crit=false;
      if(hasP("star") && c.strikes%3===0){ dmg+=4; crit=true; }
      var dealt=hitEnemy(t, dmg, false);
      pushLog("log.strike",{e:T("en."+t.k),v:dealt});
      if(crit) pushLog("log.star",{v:4},"lg-star");
      afterPlayerAction();
    } else if(action==="guard"){
      c.you.block=7;
      S.en=Math.min(S.maxEn, S.en+2+(hasUp("whistle")?1:0));
      pushLog("log.guard");
      if(hasUp("comb")){ var h=Math.min(3,S.maxHp-S.hp); if(h>0){ S.hp+=h; pushLog("log.tart",{v:h},"lg-good"); } }
      afterPlayerAction();
    } else if(action==="ability"){
      var cost=hasUp("flame")?3:4;
      if(S.en<cost){ pushLog("log.noenergy"); return API.view(); }
      S.en-=cost;
      var dmg2=10+(hasUp("flame")?2:0);
      var dealt2=hitEnemy(t, dmg2, true);
      pushLog("log.ability",{e:T("en."+t.k),v:dealt2},"lg-star");
      afterPlayerAction();
    } else if(action==="item"){
      if(item==="tart" && S.inv.tart>0){
        S.inv.tart--; S.stats.items++;
        var h2=Math.min(12,S.maxHp-S.hp); S.hp+=h2;
        pushLog("log.tart",{v:h2},"lg-good");
        afterPlayerAction();
      } else if(item==="tea" && S.inv.tea>0){
        S.inv.tea--; S.stats.items++;
        var e2=Math.min(6,S.maxEn-S.en); S.en+=e2;
        pushLog("log.tea",{v:e2},"lg-good");
        afterPlayerAction();
      }
    }
    return API.view();
  },
  useItemOut:function(id){
    if(!S) return API.view();
    if(S.combat) return API.view();
    if(id==="tart" && S.inv.tart>0 && S.hp<S.maxHp){
      S.inv.tart--; S.stats.items++;
      S.hp=Math.min(S.maxHp,S.hp+12);
    }
    return API.view();
  },
  retryStage:function(){
    if(!S || !S.over || !S.snap) return API.view();
    restore(S.snap);
    S.over=false; S.log=[];
    S.queue=STAGES[S.stage].steps.slice(); S.pageIdx=0; S.combat=null;
    advance();
    return API.view();
  },
  abandon:function(){ if(S){ S.over=true; } S.view={type:"title"}; return API.view(); },
  toTitle:function(){ S.view={type:"title"}; return API.view(); },
  save:function(){ if(!S) return null;
    return JSON.stringify({v:1, core:S}); },
  load:function(json){
    try{
      var d=JSON.parse(json);
      if(d && d.v===1 && d.core){ S=d.core; return API.view(); }
    }catch(e){}
    return null;
  },
  hasRun:function(){ return !!S && !S.over && S.view.type!=="title"; },
  /* QA/test hooks (single-player game; also used by browser checks) */
  debug:{
    setHp:function(v){ if(S){ S.hp=v; } },
    setEn:function(v){ if(S){ S.en=v; } },
    give:function(id){ if(S){ if(S.inv[id]!==undefined){ S.inv[id]++; } else { S.passives[id]=true; } } },
    up:function(id){ if(S){ S.ups[id]=true; if(id==="breath"){S.maxEn+=4;} if(id==="coat"){S.maxHp+=8;S.hp+=8;} } }
  }
};

function findOption(v,id){
  // search all stages' branch/choice option lists for full option (with steps)
  for(var i=0;i<STAGES.length;i++){
    var steps=STAGES[i].steps;
    for(var j=0;j<steps.length;j++){
      var st=steps[j];
      if(st.options){
        for(var k2=0;k2<st.options.length;k2++){
          if(st.options[k2].id===id) return st.options[k2];
        }
      }
    }
  }
  return null;
}

/* final choice: after victory of finale, the 'finalChoice' step renders a choice view;
   selecting fire/dawn sets S.ending and advances to ending step */
var _origChoose = API.choose;
API.choose = function(id){
  var v=S ? S.view : null;
  if(v && v.type==="choice" && v.final && (id==="fire"||id==="dawn")){
    S.ending=id;
    advance();
    return API.view();
  }
  if(v && v.type==="gains" && v.win && S.combat===null){
    // attach pending then-steps: they were stored on the combat step — recover from view? stored in S.combatThen
  }
  return _origChoose(id);
};

function buildEnding(){
  var which=S.ending||"dawn";
  var paras=[T("end."+which+".p1"), T("end."+which+".p2")];
  if(S.flags.child) paras.push(T("end."+which+".child"));
  S.over=true;
  if(API.onEnding) { try{ API.onEnding(which); }catch(e){} }
  S.view={type:"ending", which:which, title:T("end."+which+".t"), paras:paras,
    stats:{combats:S.stats.won, turns:S.stats.turns, dmg:S.stats.dmg, doors:S.stats.doors, items:S.stats.items}};
}

/* expose combatThen plumbing: set when combat step consumed */
var _startCombat=startCombat;
startCombat=function(keys, then, finale){
  S.combatThen=then||[];
  _startCombat(keys, then, finale);
};

return API;
})();
if (typeof module!=="undefined" && module.exports){ module.exports = TrainCore; }
</script>

var elStage, elHdr, elBrand, elHbtns, elHow;
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function T(k,p){ return TrainCore.T(k,p); }

function renderHeader(){
  elBrand.innerHTML="<b>"+esc(T("ui.title"))+"</b>";
  var langs="";
  TrainCore.langs.forEach(function(l){
    langs+='<button class="hbtn'+(UI.lang===l?" on":"")+'" data-act="lang" data-v="'+l+'">'+l.toUpperCase()+'</button>';
  });
  elHbtns.innerHTML=langs+
    '<button class="hbtn'+(UI.sound?" on":"")+'" data-act="sound">'+esc(T("ui.sound"))+'</button>'+
    '<button class="hbtn" data-act="how">'+esc(T("ui.rules"))+"</button>";
}
function kindChip(kind){
  if(!kind) return "";
  var k=kind==="combat"?"kind.combat":(kind==="encounter"?"kind.encounter":"kind.resource");
  return '<span class="kchip" style="color:var(--accent)">'+esc(T(k))+"</span>";
}
function optionButton(o,ctx){
  var l=o.l?T(o.l):(o.item?T("it."+o.item+".n"):"");
  var h=o.h?T(o.h):(o.item?T("it."+o.item+".d"):"");
  var chip=kindChip(o.kind);
  if(ctx==="upgrade"){ h=T("up."+o.id+".d"); l=T("up."+o.id+".n"); }
  return '<button class="choice" data-act="choose" data-v="'+o.id+'">'+chip+
    '<span class="cl">'+esc(l)+"</span>"+
    '<span class="ch">'+h+"</span></button>";
}
function statsBar(){
  var s=TrainCore.state(); if(!s) return "";
  var out='<div id="invbar"><span class="ilbl">'+esc(T("ui.inventory"))+"</span>";
  var any=false;
  ["tart","tea"].forEach(function(id){ var n=s.inv[id]||0; if(n>0){ any=true;
    out+='<span class="item'+(s.combat||id==="tart"?" use":"")+'" data-act="itemout" data-v="'+id+'" title="'+esc(T("it."+id+".d"))+'">'+esc(T("it."+id+".n"))+' <span class="n">×'+n+"</span></span>"; }});
  ["ticket","lantern","star","key"].forEach(function(id){ if(s.passives[id]){ any=true;
    out+='<span class="item pas" title="'+esc(T("it."+id+".d"))+'">✦ '+esc(T("it."+id+".n"))+"</span>"; }});
  if(!any) out+='<span class="item pas">'+esc(T("ui.empty"))+"</span>";
  out+="</div>";
  return out;
}
function render(){
  var v=TrainCore.view();
  if(!v){ renderTitle(); return; }
  renderHeader();
  var stage=TrainCore.state();
  var wagon=stage?STAGE_W(stage.stage):"w1";
  document.getElementById("app").style.setProperty("--accent", ACCENTS[wagon]);
  switch(v.type){
    case "title": renderTitle(); break;
    case "story": renderStory(v); break;
    case "branch": case "choice": renderChoice(v); break;
    case "reward": renderReward(v); break;
    case "upgrade": renderUpgrade(v); break;
    case "gains": renderGains(v); break;
    case "door": renderDoor(v); break;
    case "combat": renderCombat(v); break;
    case "gameover": renderGameover(v); break;
    case "ending": renderEnding(v); break;
    default: renderTitle();
  }
  if(stage && !stage.over && v.type!=="title") persist();
}

function intentHTML(it){
  var name=T(it.k);

  if(it.t==="drain"){
    var s=(it.v>0? esc(name)+" "+it.v+" · ":"")+esc(T("intent.drain",{v:it.d}));
    return '<span class="intent">'+s+"</span>";

  return '<span class="intent">⚔ '+esc(name)+" <span class='iv'>"+it.v+"</span></span>";

    statsBar()+
    '<div id="actions">'+
      '<button class="abtn" data-act="cact" data-v="strike">'+esc(T("act.strike"))+"<small>"+(5+(TrainCore.state().ups.blade?2:0))+"–"+(7+(TrainCore.state().ups.blade?2:0))+"</small></button>"+
      '<button class="abtn" data-act="cact" data-v="guard">'+esc(T("act.guard"))+"<small>+2 ⚡</small></button>"+
      '<button class="abtn" data-act="cact" data-v="ability"'+(v.actions.ability?"":" disabled")+'>'+esc(T("act.ability"))+"<small>"+esc(T("c.cost",{v:cost}))+"</small></button>"+
      items+
    "</div></div>";
}
var S_lastHit=-1, S_lastDmg=0, S_playerHit=false;
function renderGameover(v){
  elStage.innerHTML='<div class="panel"><div class="endwrap">'+
    '<div class="endtitle">'+esc(T("go.t"))+"</div>"+
    '<div class="prose" style="max-width:560px;margin:0 auto">'+T("go.p")+"</div>"+
    '<div class="btnrow" style="justify-content:center">'+
      '<button class="btn big" data-act="retry">'+esc(T("ui.retry"))+"</button>"+
      '<button class="btn big ghost" data-act="abandon">'+esc(T("ui.abandon"))+"</button>"+
    "</div></div></div>";
  snd("lose");
}
function renderEnding(v){
  elStage.innerHTML='<div class="panel"><div class="scene">'+sceneSVG(v.which==="fire"?"wf":"w7")+'</div>'+
    '<div class="endwrap">'+
    '<div class="endtitle">'+esc(v.title)+"</div>"+
    '<div class="endcols">'+v.paras.map(function(p){ return '<p class="prose">'+p+"</p>"; }).join("")+"</div>"+
    '<div class="stats">'+
      '<span class="stat">'+esc(T("stats.combats"))+" <b>"+v.stats.combats+"</b></span>"+
      '<span class="stat">'+esc(T("stats.turns"))+" <b>"+v.stats.turns+"</b></span>"+
      '<span class="stat">'+esc(T("stats.dmg"))+" <b>"+v.stats.dmg+"</b></span>"+
      '<span class="stat">'+esc(T("stats.doors"))+" <b>"+v.stats.doors+"/7</b></span>"+
      '<span class="stat">'+esc(T("stats.items"))+" <b>"+v.stats.items+"</b></span>"+
    "</div>"+
    '<div class="btnrow" style="justify-content:center"><button class="btn big" data-act="replay">'+esc(T("ui.replay"))+"</button></div>"+
    "</div></div>";
  snd("end");
}

/* ---------- persist ---------- */
function persist(){
  var d=TrainCore.save();
  if(d){ st(UI.KEY_SAVE,d); UI.hasSave=true; }
}
function loadMeta(){
  try{ var m=JSON.parse(st(UI.KEY_META)||"{}"); UI.meta=m; }catch(e){ UI.meta={endings:{}}; }
  if(!UI.meta.endings) UI.meta.endings={};
}
TrainCore.onEnding=function(which){
  UI.meta.endings[which]=true;
  try{ st(UI.KEY_META, JSON.stringify(UI.meta)); }catch(e){}
  try{ st(UI.KEY_SAVE, null); }catch(e){}
  UI.hasSave=false;
};

/* ---------- events ---------- */
function onAction(act, v, btn){
  auInit();
  switch(act){
    case "new": snd("click"); TrainCore.setLang(UI.lang); TrainCore.newRun(); UI.target=0; S_lastHit=-1; break;
    case "cont": snd("click"); { var d=st(UI.KEY_SAVE); if(d && TrainCore.load(d)){ /* ok */ } } break;
    case "choose":
      snd("click");
      var before=TrainCore.view();
      TrainCore.choose(v);
      var after=TrainCore.view();
      if(after.type==="combat" && before.type!=="combat"){ snd("door"); }
      if(after.type==="door" && before.type!=="door"){ snd("door"); }
      break;
    case "target": UI.target=parseInt(v,10)||0; snd("click"); break;
    case "cact":
      S_lastHit=-1; S_lastDmg=0; S_playerHit=false;
      var s0=TrainCore.state();
      if(v==="strike") snd("hit");
      if(v==="ability") snd("ability");
      if(v==="guard") snd("guard");
      var t=UI.target;
      var eBefore=s0 && s0.combat ? s0.combat.list[t] : null;
      TrainCore.act(v, t);
      var s1=TrainCore.state();
      if(eBefore && s1.combat){
        var eAfter=s1.combat.list[t];
        if(eAfter && eAfter.hp<eBefore.hp){ S_lastHit=t; S_lastDmg=eBefore.hp-eAfter.hp; }
      }
      if(s1.hp<s0.hp) { S_playerHit=true; snd("ehit"); }
      else if(s1.en<s0.en && v!=="ability") snd("drain");
      break;
    case "citem": snd("item"); TrainCore.act("item", UI.target, v); break;
    case "itemout": snd("item"); TrainCore.useItemOut(v); break;
    case "retry": snd("click"); TrainCore.retryStage(); break;
    case "abandon": snd("click"); TrainCore.abandon(); try{st(UI.KEY_SAVE,null);}catch(e){} UI.hasSave=false; break;
    case "replay": snd("click"); TrainCore.setLang(UI.lang); TrainCore.newRun(); UI.target=0; break;
    case "lang":
      UI.lang=v; st(UI.KEY_LANG,v); TrainCore.setLang(v); snd("click"); renderHeader(); render(); break;
    case "sound": UI.sound=!UI.sound; st(UI.KEY_SOUND,UI.sound?"1":"0"); snd("click"); renderHeader(); break;
    case "how": snd("click"); showHow(); break;
    case "closehow": snd("click"); elHow.classList.add("hidden"); break;
  }
  render();
}
function showHow(){
  var lis="";
  for(var i=1;i<=6;i++){ lis+="<li>"+T("how."+i)+"</li>"; }
  elHow.innerHTML='<div class="panel"><div class="card">'+
    '<div class="endtitle" style="font-size:22px">'+esc(T("how.title"))+"</div>"+
    "<ol>"+lis+"</ol>"+
    '<div class="btnrow" style="justify-content:center"><button class="btn" data-act="closehow">'+esc(T("ui.next"))+"</button></div>"+
    "</div></div>";
  elHow.classList.remove("hidden");
}
document.addEventListener("click", function(ev){
  var el=ev.target;
  while(el && el!==document){ 
    if(el.dataset && el.dataset.act){ onAction(el.dataset.act, el.dataset.v, el); return; }
    el=el.parentNode;
  }
});
document.addEventListener("keydown", function(ev){
  var v=TrainCore.view(); if(!v) return;
  if(ev.key==="Enter"||ev.key===" "){
    var main=elStage.querySelector(".btn, .choice");
    if(main){ ev.preventDefault(); main.click(); }
  }
  if(v.type==="combat"){
    var btns=elStage.querySelectorAll("#actions .abtn");
    var map={"1":0,"2":1,"3":2,"4":3};
    if(map[ev.key]!==undefined && btns[map[ev.key]]){ ev.preventDefault(); btns[map[ev.key]].click(); }
    if(ev.key==="q"||ev.key==="a"){ var t=elStage.querySelectorAll(".foe"); var i=(UI.target+1)%v.enemies.length; if(t[i]) t[i].click(); }
  }
});

/* ---------- boot ---------- */
function boot(){
  elStage=document.getElementById("stage");
  elHdr=document.getElementById("hdr");
  elBrand=document.getElementById("brand");
  elHbtns=document.getElementById("hbtns");
  elHow=document.getElementById("howto");
  UI.lang=st(UI.KEY_LANG)|| (navigator.language||"en").slice(0,2);
  if(TrainCore.langs.indexOf(UI.lang)<0) UI.lang="en";
  UI.sound=st(UI.KEY_SOUND)!=="0";
  loadMeta();
  UI.hasSave=!!st(UI.KEY_SAVE);
  TrainCore.setLang(UI.lang);
  TrainCore.newRun(Date.now()>>>0);
  TrainCore.toTitle();
  render();
}
boot();

/* debug/QA hook */
window.__train={
  core:TrainCore, ui:UI,
  state:function(){ return TrainCore.state(); },
  view:function(){ return TrainCore.view(); },
  render:render,
  setLang:function(l){ UI.lang=l; TrainCore.setLang(l); renderHeader(); render(); }
};
})();
</script>
